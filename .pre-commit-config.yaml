repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-toml
      - id: check-yaml

  # ruff, ruff-format and mypy run through `uv run` rather than as
  # pinned-rev mirror hooks, so pre-commit and CI (which calls `uv run
  # ruff` / `uv run mypy`) use exactly the same tool versions from the
  # lockfile. Pinned mirror hooks drift: a newer ruff drops rules the old
  # one still enforces, and isolated mypy can't see PySide6 / typer /
  # pandas stubs and reports every Qt base class as `Any`.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
