[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrics-calculator-python"
version = "0.1.0"
description = "Object-oriented software quality metrics calculator for Python codebases (AST-based)."
readme = "README.md"
license = "EPL-2.0"
requires-python = ">=3.11,<3.14"
# The core engine (src/metrics_calculator, excluding cli/) has zero
# runtime dependencies beyond the standard library -- it imports no UI
# code and needs no data libraries. The CLI is an optional extra so a
# bare `pip install metrics-calculator-python` stays dependency-free.
dependencies = []

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.7", "pandas>=2.1", "openpyxl>=3.1"]
# The desktop app only touches QtCore/QtGui/QtWidgets, so it depends on
# pyside6-essentials rather than the full `pyside6` meta-package -- that
# drops the ~160 MB pyside6-addons wheel (QtCharts, QtWebEngine, Qt3D,
# ...) which nothing here imports. `pip install
# metrics-calculator-python[cli,gui]` additionally enables .xlsx export
# from the results table.
gui = ["pyside6-essentials>=6.7"]

[project.scripts]
metrics-calculator = "metrics_calculator.cli.app:app"
metrics-calculator-gui = "metrics_calculator.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_calculator"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "typer>=0.12",
    "rich>=13.7",
    # Also needed to run the legacy app/ during the Phase 1-4 transition
    # (the old GUI + Excel export). Remove once app/ is deleted.
    "pyqt5>=5.15.9",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "pandas-stubs>=2.1",
    "pytest-qt>=4.4",
    "pyinstaller>=6.10",
    "pyside6-essentials>=6.7",
]

[tool.uv]
# PyQt5-Qt5 (the bundled Qt binaries) stopped publishing Windows wheels
# after 5.15.2 -- every later release on PyPI is Linux/macOS only. 5.15.2
# is the newest version with wheels for all platforms we target, so it's
# pinned here rather than left to float. Revisit when Phase 3 evaluates
# PySide6; only relevant while the legacy app/ GUI is still around.
constraint-dependencies = ["pyqt5-qt5==5.15.2"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `app/` is pre-rewrite legacy code (Phase 3 replaces its GUI outright,
# Phase 1 already replaced its engine); linting it now would just be
# noise. Drop this exclusion once app/ is deleted.
# `tests/fixtures` holds deliberately minimal (and in one case deliberately
# invalid) sample source used as analysis input, not maintained code.
extend-exclude = ["app", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Qt's virtual model methods are defined with `QModelIndex()` as the
# default parent argument -- it's the framework's own idiom and the value
# is never mutated.
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.mypy]
python_version = "3.11"
# `app/` is untyped legacy code (Phase 3 replaces its GUI, Phase 1 already
# replaced its engine); Phase 1's new package under src/ is fully typed and
# strict-clean, but `app/` itself is excluded below rather than fixed out
# of phase order.
mypy_path = ["app"]
files = ["src", "tests"]
exclude = ["tests/fixtures"]
strict = true
# The test harness for the legacy engine necessarily calls into `app/`'s
# untyped code. Without this, strict mode's disallow_untyped_calls flags
# every such call. Drop once app/ is deleted.
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# `app/src` is untyped legacy code (see above). mypy still follows it from
# the legacy test harness for inference, but its own internal errors
# aren't ours to fix out of phase order, so they're suppressed here rather
# than widening `files` to cover `app/`.
module = "src.*"
ignore_errors = true

[[tool.mypy.overrides]]
# pytest's assertion rewriter optionally imports numpy for array-diffing;
# mypy follows that import even though nothing in this project uses numpy
# directly, and numpy's bundled stubs require Python >= 3.12 syntax. Skip
# rather than parse them.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
